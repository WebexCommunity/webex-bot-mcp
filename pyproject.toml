[project]
name = "webex-bot-mcp"
version = "0.1.0"
description = "MCP server for Webex — send messages, manage rooms, and automate team communication via AI assistants"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastmcp>=2.9.0",
    "webexpythonsdk>=2.0.4",
]

[project.scripts]
webex-bot-mcp = "main:main"
